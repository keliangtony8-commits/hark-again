# 原生 App 自动打包：推到 GitHub 后在 Actions 页面下载安装包。
# - 安卓 APK：每次改动 app/ 都会出包（免费 Linux 机器）
# - iOS：手动触发（需要 Mac 机器；正式安装到 iPhone 还要苹果开发者账号签名）
name: app

on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      ios:
        description: "同时编译 iOS（不签名，仅验证能编译）"
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-android
          path: app/build/app/outputs/flutter-apk/*.apk

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

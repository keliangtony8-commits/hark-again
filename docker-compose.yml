services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: assistant
    # 小内存调参：默认值按 4GB VPS 设，大机器可在 .env 调大
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-128MB}", "-c", "max_connections=${PG_MAX_CONNECTIONS:-40}", "-c", "work_mem=4MB", "-c", "effective_cache_size=${PG_CACHE_SIZE:-512MB}"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 5s
    restart: unless-stopped

  # 模型网关（约 500MB 内存）：只在 COMPOSE_PROFILES 含 gateway 时启动；小 VPS 用直连模式不跑它
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: [gateway]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      STEP_API_KEY: ${STEP_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes: [./deploy/litellm/config.yaml:/app/config.yaml:ro]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes: [./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro]
    restart: unless-stopped

  # 沙盒基础镜像：只构建不运行（docker compose build sandbox-image）
  sandbox-image:
    build: ./sandbox/image
    image: assistant-sandbox:latest
    profiles: [build-only]

  # 唯一持有 Docker 权限的服务；不对外暴露端口
  sandbox:
    build: ./sandbox
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN}
      SANDBOX_TZ: ${TIMEZONE:-Asia/Shanghai}   # 工作区命令的时区 = 用户时区
      HOST_PROJECTS_DIR: ${HOST_DATA_DIR}/projects
      SANDBOX_MEM: ${SANDBOX_MEM:-1g}
      SANDBOX_IDLE_MINUTES: ${SANDBOX_IDLE_MINUTES:-30}
      SANDBOX_MAX_RUNNING: ${SANDBOX_MAX_RUNNING:-3}
      SANDBOX_HOST_RESERVE: ${SANDBOX_HOST_RESERVE:-256m}
      SANDBOX_NETWORK: assistant-sandboxes
      # v2.37 出网关卡（sandbox/egress.py）：容器里命令的上网都走本服务 3128 端口的代理，公网放行、内网拦下。
      # 允许名单与后端 OUTBOUND_ALLOW_HOSTS 同一份；拒绝名单另给（例：*.example.com, 203.0.113.0/24）
      SANDBOX_ALLOW_HOSTS: ${OUTBOUND_ALLOW_HOSTS:-}
      SANDBOX_DENY_HOSTS: ${SANDBOX_DENY_HOSTS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_DATA_DIR}/projects:/projects
      - ${HOST_DATA_DIR}/sandbox:/state   # 停机原因（stopped.json），本服务重启不丢
    # sandboxes：每个工作区的容器也接在这个网络上，端口预览从这里直连容器（容器端口从不映射到宿主机）
    networks: [default, sandboxes]
    restart: unless-stopped

  # 云浏览器：唯一运行 Chromium 的服务，不对外；登录状态存在 data/browser
  browser:
    build: ./browser
    environment:
      BROWSER_TOKEN: ${BROWSER_TOKEN}
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-3}
      # 浏览器出网关卡的允许名单（与后端 OUTBOUND_ALLOW_HOSTS 同一份：用户自己的 NAS 之类）
      BROWSER_ALLOW_HOSTS: ${OUTBOUND_ALLOW_HOSTS:-}
    volumes:
      - ${HOST_DATA_DIR}/browser:/state
    shm_size: ${BROWSER_SHM:-1gb}
    mem_limit: ${BROWSER_MEM:-1500m}
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://assistant:${POSTGRES_PASSWORD}@postgres:5432/assistant
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000}
      SEARXNG_URL: http://searxng:8080
      SANDBOX_URL: http://sandbox:9000
      SANDBOX_TOKEN: ${SANDBOX_TOKEN}
      BROWSER_URL: http://browser:9100
      BROWSER_TOKEN: ${BROWSER_TOKEN}
    volumes:
      - ${HOST_DATA_DIR}:/data
      # 服务器主机模式：宿主机主机代理的 unix socket（没装时只是个空目录，功能不出现）
      - /run/assistant-host:/run/assistant-host
    depends_on:
      sandbox: {condition: service_started}
      browser: {condition: service_started}
      searxng: {condition: service_started}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # 定时任务执行器：与 backend 同一镜像，不跑迁移、不对外
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://assistant:${POSTGRES_PASSWORD}@postgres:5432/assistant
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000}
      SEARXNG_URL: http://searxng:8080
      SANDBOX_URL: http://sandbox:9000
      SANDBOX_TOKEN: ${SANDBOX_TOKEN}
      BROWSER_URL: http://browser:9100
      BROWSER_TOKEN: ${BROWSER_TOKEN}
    volumes:
      - ${HOST_DATA_DIR}:/data
      # 服务器主机模式：宿主机主机代理的 unix socket（没装时只是个空目录，功能不出现）
      - /run/assistant-host:/run/assistant-host
    depends_on: [backend]
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:

networks:
  sandboxes:
    name: assistant-sandboxes
    # v2.37：internal = 这个网络没有通往外面的路由。沙盒容器只接这一个网络，所以它们唯一的出网路是
    # sandbox 服务上的出网代理（它另外接 default 网络才能出去）；也连不到宿主机端口和云主机元数据。
    # 旧部署的网络不是 internal：deploy/update.sh 会删掉重建（沙盒容器先删，下次用到自动重建，工作区不丢）
    internal: true

name: assistant
description: "A new Flutter project."
publish_to: 'none'
version: 2.90.3+29003

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  record: ^7.1.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: any

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark.png
  # v2.83 §G：Inter（OFL-1.1，rsms/inter v4.1，拉丁子集，许可见 assets/fonts/Inter-OFL.txt）。中文用系统字。
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

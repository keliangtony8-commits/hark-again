name: assistant
description: "A new Flutter project."
publish_to: 'none'
version: 3.5.2+30502

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  http: ^1.6.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  record: ^7.1.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: any

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark.png
  # v3.3 流光壁纸（ui/sky.dart）：一个片元着色器，整屏一次绘制
  shaders:
    - shaders/sky.frag
    - shaders/sky_blit.frag
  # v3.2：中英同一套 MiSans（小米，免费商用可嵌入，须注明；常用字子集，许可见 assets/fonts/MiSans-LICENSE.txt）。
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 600
